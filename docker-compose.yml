
version: "3.3"
services:

  mariadb:
    container_name: anon-blog-mariadb
    environment:
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${SECRET_KEY}"
      MARIADB_ROOT_PASSWORD: "${SECRET_KEY}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
    image: "mariadb:10.6"
    restart: unless-stopped
    ports:
      - 127.0.0.1:3306:3306

  web:
    container_name: anon-blog-web
    depends_on:
      - mariadb
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      SQLALCHEMY_DATABASE_URI: "mariadb+mariadbconnector://${MARIADB_USER}:${SECRET_KEY}@mariadb:3306/${MARIADB_DATABASE}"
      SQLALCHEMY_TRACK_MODIFICATIONS: "${SQLALCHEMY_TRACK_MODIFICATIONS}"
    build: .
    ports:
      - 127.0.0.1:5005:5000
    restart: unless-stopped

