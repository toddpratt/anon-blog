
services:

  mariadb:
    image: "mariadb:10.6"
    environment:
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${SECRET_KEY}"
      MARIADB_ROOT_PASSWORD: "${SECRET_KEY}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
    restart: unless-stopped

  bootstrap:
    image: anon-blog:2
    entrypoint: ['/venv/bin/flask', 'db', 'upgrade']
    depends_on:
      - mariadb

  web:
    image: anon-blog:2
    depends_on:
      - bootstrap
      - mariadb
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      SQLALCHEMY_DATABASE_URI: "mariadb+mariadbconnector://${MARIADB_USER}:${SECRET_KEY}@mariadb:3306/${MARIADB_DATABASE}"
      SQLALCHEMY_TRACK_MODIFICATIONS: "${SQLALCHEMY_TRACK_MODIFICATIONS}"
    ports:
      - 127.0.0.1:5005:5000
    restart: unless-stopped

