apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-postgres-0
  namespace: anon-blog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: anon-blog
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres

      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "anon-blog"

        vault.hashicorp.com/agent-inject-secret-db-creds.env: "secret/data/anon-blog/postgres"
        vault.hashicorp.com/agent-inject-template-db-creds.env: |
          {{- with secret "secret/data/anon-blog/postgres" -}}
          POSTGRES_USER={{ .Data.data.username }}
          POSTGRES_PASSWORD={{ .Data.data.password }}
          {{- end }}

    spec:
      containers:
      - name: postgres
        image: postgres:17
        command: [ "/bin/sh", "-c" ]
        args:
          - |
            export $(grep -v '^#' /vault/secrets/db-creds.env | xargs)
            exec docker-entrypoint.sh postgres

        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: anonblog
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
      storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: anon-blog
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
