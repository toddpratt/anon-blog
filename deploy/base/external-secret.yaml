apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: anon-blog-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_USER
    remoteRef:
      key: secret/anon-blog/postgres
      property: username
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: secret/anon-blog/postgres
      property: password
